server:
  port: 8080

spring:
  application:
    name: java-inventory
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/labdb}
    username: ${SPRING_DATASOURCE_USERNAME:labuser}
    password: ${SPRING_DATASOURCE_PASSWORD:labpass}
    hikari:
      maximum-pool-size: 5
      initialization-fail-timeout: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: java-inventory
    distribution:
      percentiles-histogram:
        http.server.requests: true
