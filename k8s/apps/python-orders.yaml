apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-orders
  namespace: lab
  labels:
    app: python-orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-orders
  template:
    metadata:
      labels:
        app: python-orders
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: python-orders
          image: python-orders:1.0
          imagePullPolicy: Never   # imagem carregada com "kind load docker-image"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_DB } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD } }
            - name: INVENTORY_URL
              value: http://java-inventory:8080
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
          resources:
            requests: { cpu: 50m,  memory: 96Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: python-orders
  namespace: lab
  labels:
    app: python-orders
spec:
  selector:
    app: python-orders
  ports:
    - name: http
      port: 8000
      targetPort: 8000
