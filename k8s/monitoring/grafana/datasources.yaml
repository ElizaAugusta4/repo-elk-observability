apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus.monitoring.svc.cluster.local:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Elasticsearch
    uid: elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch.logging.svc.cluster.local:9200
    jsonData:
      index: "app-logs-*"
      timeField: "@timestamp"
      logMessageField: message
      logLevelField: level
