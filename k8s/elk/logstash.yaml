apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: logging
data:
  logstash.yml: |
    http.host: "0.0.0.0"
    xpack.monitoring.enabled: false

  logstash.conf: |
    input {
      beats {
        port => 5044
      }
    }

    filter {
      # As apps logam em JSON: extrai os campos (level, service, message...) para a raiz
      if [message] =~ /^\s*\{/ {
        json {
          source => "message"
          skip_on_invalid_json => true
        }
      }

      # Campo "app" vindo do label do pod no Kubernetes
      if [kubernetes][labels][app] {
        mutate { add_field => { "app" => "%{[kubernetes][labels][app]}" } }
      }

      # Padroniza o nível do log (Python usa WARNING, Java usa WARN)
      if [level] {
        mutate { uppercase => ["level"] }
        if [level] == "WARNING" {
          mutate { replace => { "level" => "WARN" } }
        }
      } else {
        mutate { add_field => { "level" => "INFO" } }
      }

      mutate { remove_field => ["agent", "ecs", "input", "@version"] }
    }

    output {
      elasticsearch {
        hosts => ["http://elasticsearch.logging.svc.cluster.local:9200"]
        index => "app-logs-%{+YYYY.MM.dd}"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: logging
  labels:
    app: logstash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.15.3
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          ports:
            - name: beats
              containerPort: 5044
            - name: api
              containerPort: 9600
          readinessProbe:
            httpGet: { path: /, port: 9600 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 768Mi }
            limits:   { cpu: "1",  memory: 1Gi }
          volumeMounts:
            - name: config
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
            - name: config
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
      volumes:
        - name: config
          configMap:
            name: logstash-config
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: logging
spec:
  selector:
    app: logstash
  ports:
    - name: beats
      port: 5044
      targetPort: 5044
